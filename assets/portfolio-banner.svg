<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Gener Suhul, portafolio interactivo de ingeniería de software">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#0C1825"/><stop offset="1" stop-color="#122A37"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#78C8BB" stop-opacity=".18"/><stop offset="1" stop-color="#78C8BB" stop-opacity="0"/></radialGradient>
 <style>
 .path{fill:none;stroke:#608e93;stroke-width:1.5;stroke-dasharray:6 8;animation:drift 7s linear infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}
 .pulse2{animation:pulse 3s ease-in-out -1.5s infinite}
 @keyframes drift{to{stroke-dashoffset:-140}}
 @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.path,.pulse,.pulse2{animation:none}}
 </style>
</defs>
<rect width="960" height="260" rx="16" fill="url(#bg)"/>
