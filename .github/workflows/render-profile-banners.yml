name: Render profile banners
on:
  push:
    branches: [main]
    paths:
      - 'profile-assets/render_banners.py'
      - '.github/workflows/render-profile-banners.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Renderizar banners GIF
        run: python profile-assets/render_banners.py
      - name: Publicar archivos generados
        run: |
          git add assets/profile-dark.gif assets/profile-light.gif assets/architecture-dark.svg assets/architecture-light.svg portfolio/architecture-dark.svg portfolio/architecture-light.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(profile): generar GIF claro y oscuro'
            git push origin HEAD:main
          fi
